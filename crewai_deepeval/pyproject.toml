[project]
name = "crewai_deepeval"
version = "0.1.0"
description = "crewai_deepeval using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.165.1,<1.0.0",
    "deepeval>=3.3.9",
]

[project.scripts]
kickoff = "crewai_deepeval.main:kickoff"
run_crew = "crewai_deepeval.main:kickoff"
plot = "crewai_deepeval.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
